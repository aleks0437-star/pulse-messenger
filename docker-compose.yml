services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: pulse, POSTGRES_PASSWORD: pulse, POSTGRES_DB: pulse }
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pulse"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  livekit:
    image: livekit/livekit-server:v1.8
    command: --dev --bind 0.0.0.0
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-miniosecret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGINS:-http://localhost:3000}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: { condition: service_started }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-miniosecret}
      S3_BUCKET: ${S3_BUCKET:-pulse-media}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set pulse http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do sleep 1; done;
        mc mb --ignore-existing "pulse/$${S3_BUCKET}";
        mc anonymous set download "pulse/$${S3_BUCKET}"
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:?REFRESH_JWT_SECRET is required}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      API_PORT: 4000
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-loopback}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-pulse-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-miniosecret}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/pulse-media}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@pulse.local}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BN3m0wVDPKjh1tD4ZSZhro_7gYu7e2mayLxu01OSEEAlytRiV4S8fnr10-o38XuYNkAKOkOi9PWfE1sEiClPyt8}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-ZdpuJqeldYjWdyhv7bmtWHh7y33BPgpeTHJnUwrWcAg}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-BN3m0wVDPKjh1tD4ZSZhro_7gYu7e2mayLxu01OSEEAlytRiV4S8fnr10-o38XuYNkAKOkOi9PWfE1sEiClPyt8}
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      backend: { condition: service_healthy }
    ports: ["3000:3000"]
volumes: { postgres_data: {}, minio_data: {} }
